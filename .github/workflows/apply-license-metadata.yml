name: Apply license metadata

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-license-metadata.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update license references
        shell: python
        run: |
          from pathlib import Path

          readme_path = Path("README.md")
          text = readme_path.read_text(encoding="utf-8")

          replacements = {
              '[![License: MIT](https://img.shields.io/badge/License-MIT-blue.svg)](LICENSE)':
                  '[![License: PolyForm Strict 1.0.0](https://img.shields.io/badge/License-PolyForm%20Strict%201.0.0-orange.svg)](LICENSE)',
              'Fork, branch, and open a pull request. Issues and feature requests are welcome.':
                  'Issues, feature requests, benchmark results, and documentation corrections are welcome. Code modifications, forks containing modified code, and pull requests require prior written permission under the current source license.',
              'MIT License. See [LICENSE](LICENSE).':
                  'Qubit is source-available under the **PolyForm Strict License 1.0.0**. Noncommercial use is permitted. Distribution, modification, derivative works, sublicensing, transfer, and commercial use require separate written permission. See [LICENSE](LICENSE), [LICENSE_HISTORY.md](LICENSE_HISTORY.md), and [COMMERCIAL_LICENSE.md](COMMERCIAL_LICENSE.md). Earlier versions lawfully obtained under MIT remain under their original MIT terms.'
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"Required README text not found: {old[:80]}")
              text = text.replace(old, new)

          readme_path.write_text(text, encoding="utf-8")

          Path("CONTRIBUTING.md").write_text(
              """# Contributing to Qubit\n\nIssues, reproducibility reports, benchmark results, documentation corrections, and responsible security reports are welcome.\n\nThe current Qubit source is licensed under PolyForm Strict 1.0.0, which does not grant permission to create or distribute modifications. Do not publish a fork, patch, derivative work, or pull request containing modified Qubit code without written permission from the applicable copyright holder.\n\nTo request permission for a proposed code contribution, contact contact@qelm.org or contact@rdbiotechalaska.com before making or publishing the modification. Any accepted contribution will require written contributor terms that preserve the project's licensing and commercial-licensing rights.\n""",
              encoding="utf-8",
          )

          Path(".github/workflows/apply-license-metadata.yml").unlink()
      - name: Commit license metadata
        run: |
          git config user.name "R&D BioTech Alaska"
          git config user.email "contact@rdbiotechalaska.com"
          git add README.md CONTRIBUTING.md .github/workflows/apply-license-metadata.yml
          git commit -m "Update Qubit license references and contribution policy"
          git push
